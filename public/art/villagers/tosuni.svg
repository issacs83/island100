<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260">
  <!-- 토순이 · 토끼 이웃 (오리지널 캐릭터) -->
  <g stroke="#6b5138" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- ears -->
    <ellipse cx="72" cy="52" rx="17" ry="46" fill="#f3e6d8"/>
    <ellipse cx="72" cy="54" rx="7" ry="30" fill="#f6c9c2" stroke="none"/>
    <ellipse cx="128" cy="52" rx="17" ry="46" fill="#f3e6d8"/>
    <ellipse cx="128" cy="54" rx="7" ry="30" fill="#f6c9c2" stroke="none"/>
    <!-- body / dress -->
    <ellipse cx="100" cy="204" rx="50" ry="44" fill="#9fd0b4"/>
    <path d="M 66 190 L 66 222 M 134 190 L 134 222" stroke="#7fb294" fill="none" stroke-width="4"/>
    <!-- feet -->
    <ellipse cx="80" cy="246" rx="17" ry="11" fill="#f3e6d8"/>
    <ellipse cx="120" cy="246" rx="17" ry="11" fill="#f3e6d8"/>
    <!-- arms -->
    <ellipse cx="56" cy="196" rx="12" ry="18" fill="#f3e6d8" transform="rotate(14 56 196)"/>
    <ellipse cx="144" cy="196" rx="12" ry="18" fill="#f3e6d8" transform="rotate(-14 144 196)"/>
    <!-- head -->
    <circle cx="100" cy="122" r="66" fill="#f3e6d8"/>
    <!-- cheeks -->
    <ellipse cx="58" cy="138" rx="13" ry="9" fill="#f2b8b0" stroke="none" opacity=".8"/>
    <ellipse cx="142" cy="138" rx="13" ry="9" fill="#f2b8b0" stroke="none" opacity=".8"/>
    <!-- eyes -->
    <ellipse cx="76" cy="118" rx="10" ry="13" fill="#3a2e28" stroke="none"/>
    <ellipse cx="124" cy="118" rx="10" ry="13" fill="#3a2e28" stroke="none"/>
    <circle cx="79.5" cy="113" r="3.6" fill="#ffffff" stroke="none"/>
    <circle cx="127.5" cy="113" r="3.6" fill="#ffffff" stroke="none"/>
    <circle cx="73" cy="122" r="1.8" fill="#ffffff" stroke="none" opacity=".8"/>
    <circle cx="121" cy="122" r="1.8" fill="#ffffff" stroke="none" opacity=".8"/>
    <!-- nose + mouth -->
    <path d="M 96 134 L 104 134 L 100 140 Z" fill="#f0958c" stroke="none"/>
    <path d="M 100 141 Q 94 150 88 145 M 100 141 Q 106 150 112 145" fill="none" stroke-width="4"/>
  </g>
</svg>
