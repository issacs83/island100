<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260">
  <!-- 다롱이 · 다람쥐 이웃 (오리지널 캐릭터) -->
  <g stroke="#6b5138" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- fluffy tail (behind) -->
    <path d="M 138 208 Q 190 196 182 142 Q 176 106 148 108 Q 128 110 134 138 Q 140 166 122 186 Z" fill="#b0763f"/>
    <path d="M 150 190 Q 172 178 168 148" fill="none" stroke="#8a5a34" stroke-width="4"/>
    <!-- tuft ears -->
    <path d="M 62 66 L 48 26 L 84 48 Z" fill="#c98d5a"/>
    <path d="M 138 66 L 152 26 L 116 48 Z" fill="#c98d5a"/>
    <!-- body -->
    <ellipse cx="100" cy="206" rx="46" ry="42" fill="#c98d5a"/>
    <ellipse cx="100" cy="216" rx="28" ry="26" fill="#f0dcc0" stroke="none"/>
    <!-- feet -->
    <ellipse cx="82" cy="246" rx="16" ry="10" fill="#c98d5a"/>
    <ellipse cx="118" cy="246" rx="16" ry="10" fill="#c98d5a"/>
    <!-- arms -->
    <ellipse cx="58" cy="200" rx="11" ry="16" fill="#c98d5a" transform="rotate(14 58 200)"/>
    <ellipse cx="142" cy="200" rx="11" ry="16" fill="#c98d5a" transform="rotate(-14 142 200)"/>
    <!-- scarf -->
    <path d="M 68 172 Q 100 190 132 172 L 130 186 Q 100 202 70 186 Z" fill="#f2cf5a"/>
    <path d="M 126 184 L 138 214 L 120 210 Z" fill="#f2cf5a"/>
    <!-- head -->
    <circle cx="100" cy="120" r="64" fill="#c98d5a"/>
    <ellipse cx="100" cy="146" rx="40" ry="32" fill="#f0dcc0" stroke="none"/>
    <!-- cheeks -->
    <ellipse cx="58" cy="138" rx="13" ry="9" fill="#e8a075" stroke="none" opacity=".8"/>
    <ellipse cx="142" cy="138" rx="13" ry="9" fill="#e8a075" stroke="none" opacity=".8"/>
    <!-- eyes -->
    <ellipse cx="76" cy="116" rx="10" ry="13" fill="#3a2e28" stroke="none"/>
    <ellipse cx="124" cy="116" rx="10" ry="13" fill="#3a2e28" stroke="none"/>
    <circle cx="79.5" cy="111" r="3.6" fill="#ffffff" stroke="none"/>
    <circle cx="127.5" cy="111" r="3.6" fill="#ffffff" stroke="none"/>
    <circle cx="73" cy="120" r="1.8" fill="#ffffff" stroke="none" opacity=".8"/>
    <circle cx="121" cy="120" r="1.8" fill="#ffffff" stroke="none" opacity=".8"/>
    <!-- nose + buck teeth smile -->
    <path d="M 95 134 Q 100 140 105 134" fill="none" stroke-width="4"/>
    <rect x="94" y="140" width="12" height="10" rx="3" fill="#ffffff"/>
  </g>
</svg>
